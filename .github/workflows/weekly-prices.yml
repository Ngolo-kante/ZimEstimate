name: Weekly ZBMS price collection

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC (08:00 Harare)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect ZBMS prices
        run: npm run collect:prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          COLLECT_OUTPUT_DIR: output/prices

      - name: Upload collection summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zbms-prices
          path: output/prices/zbms-summary.json
